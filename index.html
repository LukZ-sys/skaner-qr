<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skaner i Aparat Offline</title>
    <!-- Lokalne biblioteki -->
    <script src="jsQR.min.js"></script>
    <script src="jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #222; color: white; text-align: center; }
        #camera-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; }
        video { width: 100%; display: block; }
        #overlay { position: absolute; top: 10px; left: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; font-weight: bold; }
        .controls { padding: 15px; }
        button { font-size: 16px; padding: 12px 20px; margin: 5px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-capture { background: #4CAF50; color: white; width: 80%; padding: 15px; font-size: 20px; }
        .btn-reset { background: #f44336; color: white; }
        .btn-zip { background: #2196F3; color: white; width: 80%; margin-top: 20px; }
        #canvas { display: none; }
        #photo-list { font-size: 14px; margin-top: 10px; color: #aaa; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>

    <div id="camera-container">
        <video id="video" playsinline autoplay></video>
        <div id="overlay">Szukam kodu QR...</div>
    </div>

    <div class="controls">
        <button id="btnCapture" class="btn-capture" disabled>Zrób zdjęcie</button>
        <button id="btnReset" class="btn-reset">Zakończ detal</button>
        <button id="btnZip" class="btn-zip">Zapisz i Pobierz ZIP</button>
        <div id="photo-list">Ilość zdjęć w pamięci: <span id="count">0</span></div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const overlay = document.getElementById('overlay');
        const btnCapture = document.getElementById('btnCapture');
        
        let currentQR = null;
        let photoCounter = 1;
        let photos = [];
        let scanning = true;

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(function(stream) {
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            video.play();
            requestAnimationFrame(tick);
        }).catch(function(err) {
            alert("Brak dostępu do kamery: " + err);
        });

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && scanning) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

                if (code) {
                    currentQR = code.data.replace(/[\\/*?:"<>|]/g, "");
                    scanning = false;
                    photoCounter = 1;
                    overlay.innerHTML = `Aktywny kod: <span style="color:#4CAF50">${currentQR}</span>`;
                    btnCapture.disabled = false;
                    btnCapture.innerText = `Zrób zdjęcie detalu (${photoCounter})`;
                }
            }
            if (scanning) requestAnimationFrame(tick);
        }

        function getCategory(qr) {
            const up = qr.toUpperCase();
            if(up.startsWith("ESK")) return "ESK";
            if(up.startsWith("TVG")) return "TVG";
            if(up.startsWith("HST")) return "HST";
            if(up.startsWith("AST")) return "ASTM";
            return "INNE";
        }

        btnCapture.onclick = function() {
            if (!currentQR) return;
            
            const scale = Math.min(1280 / video.videoWidth, 1);
            canvas.width = video.videoWidth * scale;
            canvas.height = video.videoHeight * scale;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            const category = getCategory(currentQR);
            const fileName = `${category}/${currentQR}_${photoCounter}.jpg`;
            
            photos.push({ name: fileName, data: dataUrl.split(',')[1] });
            
            photoCounter++;
            document.getElementById('count').innerText = photos.length;
            btnCapture.innerText = `Zrób zdjęcie detalu (${photoCounter})`;
            
            overlay.style.backgroundColor = "white";
            setTimeout(() => overlay.style.backgroundColor = "rgba(0,0,0,0.7)", 150);
        };

        document.getElementById('btnReset').onclick = function() {
            currentQR = null;
            scanning = true;
            btnCapture.disabled = true;
            btnCapture.innerText = "Zrób zdjęcie";
            overlay.innerHTML = "Szukam kodu QR...";
            requestAnimationFrame(tick);
        };

        document.getElementById('btnZip').onclick = function() {
            if (photos.length === 0) {
                alert("Brak zdjęć do zapisu!");
                return;
            }
            
            overlay.innerHTML = "Generowanie ZIP...";
            const zip = new JSZip();
            
            photos.forEach(photo => {
                zip.file(photo.name, photo.data, {base64: true});
            });

            zip.generateAsync({type:"blob"}).then(function(content) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = "Zdjecia_Posortowane.zip";
                link.click();
                
                photos = [];
                document.getElementById('count').innerText = "0";
                document.getElementById('btnReset').click();
                overlay.innerHTML = "Pobrano! Szukam kodu QR...";
            });
        };
    </script>
</body>
</html>
